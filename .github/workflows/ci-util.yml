name: CI on Util 

on:
  push:
    paths: [
      "packages/lib/**/*.ts",
      "packages/lib/**/package.json",
    ]
    branches: [ main ]
  pull_request:
    paths: [
      "packages/lib/**/*.ts",
      "packages/lib/**/package.json",
    ]
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "7.x"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm turbo run lint --filter logger --filter markdown-library

      - name: Run the tests and generate coverage report
        run: pnpm turbo run test --filter logger --filter markdown-library

      - name: Build
        run: pnpm turbo run build --filter logger --filter markdown-library
