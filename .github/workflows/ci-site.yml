name: CI on Site nextjs

on:
  push:
    paths: [
      "apps/site-nextjs/**/*.ts",
      "apps/site-nextjs/**/*.tsx",
      "apps/site-nextjs/**/package.json",
    ]
    branches: [ main ]
  pull_request:
    paths: [
      "apps/site-nextjs/**/*.ts",
      "apps/site-nextjs/**/*.tsx",
      "apps/site-nextjs/**/package.json",
    ]
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "7.x"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm turbo run lint --filter site-nextjs

      - name: Run the tests and generate coverage report
        run: pnpm turbo run test --filter site-nextjs

      - name: Build
        run: pnpm turbo run build --filter site-nextjs

