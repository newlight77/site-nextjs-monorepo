name: CI on Site nextjs

on:
  push:
    paths: [
      "/apps/site-nextjs/**/*.ts",
      "/apps/site-nextjs/**/*.tsx",
    ]
    branches: [ master ]
  pull_request:
    paths: [
      "/apps/site-nextjs/**/*.ts",
      "/apps/site-nextjs/**/*.tsx",
    ]
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: yarn setup

    - name: Run the tests and generate coverage report
      run: turbo run test --filter site-nextjs

    - name: Build
      run: turbo run build --filter site-nextjs

