name: CI on UI React Notion components

on:
  push:
    paths: [
      "packages/ui/react-notion-library/**/*.ts",
      "packages/ui/react-notion-library/**/*.tsx",
      "packages/ui/react-notion-library/**/package.json",
    ]
    branches: [ main ]
  pull_request:
    paths: [
      "packages/ui/react-notion-library/**/*.ts",
      "packages/ui/react-notion-library/**/*.tsx",
      "packages/ui/react-notion-library/**/package.json",
    ]
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "7.x"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint check
        run: pnpm turbo run lint --filter react-notion-library

      - name: Run the tests and generate coverage report
        run: pnpm turbo run test --filter react-notion-library

      - name: Build
        run: pnpm turbo run build --filter react-notion-library
